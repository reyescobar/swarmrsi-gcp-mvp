apiVersion: v1
kind: Namespace
metadata:
  name: swarm-sandboxes
---
apiVersion: v1
kind: Namespace
metadata:
  name: harness
  labels:
    ate.dev/api-access: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: broker
  namespace: harness
  annotations:
    iam.gke.io/gcp-service-account: swarmrsi-broker@${PROJECT_ID}.iam.gserviceaccount.com
---
# 1. Primary Cloud Hypervisor MicroVM WorkerPool (targets c3-highcpu-192-metal KVM nodes)
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: swarm-workers-microvm
  namespace: swarm-sandboxes
  labels:
    pool: swarm-microvm
spec:
  replicas: 2
  workerImage: ${REGION}-docker.pkg.dev/${PROJECT_ID}/swarmrsi-ghcr-mirror/agent-substrate/substrate/ateworker-microvm:v1.0.1
  sandboxClasses:
    - name: microvm
      configRef: microvm
  template:
    metadata:
      labels:
        pool: swarm-microvm
    spec:
      nodeSelector:
        pool: microvm-metal
      tolerations:
        - key: ate.dev/sandboxClass
          operator: Equal
          value: microvm
          effect: NoSchedule
      resources:
        requests:
          cpu: "16"
          memory: "36Gi"
        limits:
          cpu: "32"
          memory: "64Gi"
---
# 2. Instant Zero-Quota Day-1 gVisor WorkerPool (targets standard system-gvisor nodes)
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: swarm-workers-gvisor
  namespace: swarm-sandboxes
  labels:
    pool: swarm-gvisor
spec:
  replicas: 2
  workerImage: ${REGION}-docker.pkg.dev/${PROJECT_ID}/swarmrsi-ghcr-mirror/agent-substrate/substrate/ateworker-gvisor:v1.0.1
  sandboxClasses:
    - name: gvisor
      configRef: gvisor-default
  template:
    metadata:
      labels:
        pool: swarm-gvisor
    spec:
      nodeSelector:
        pool: system-gvisor
      resources:
        requests:
          cpu: "4"
          memory: "12Gi"
        limits:
          cpu: "8"
          memory: "24Gi"
---
# 3. Unified Keyless Broker + SwarmRSI Orchestrator Deployment & Service (:8080)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarm-control-plane
  namespace: harness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swarm-control-plane
  template:
    metadata:
      labels:
        app: swarm-control-plane
    spec:
      serviceAccountName: broker
      nodeSelector:
        pool: system-gvisor
      containers:
        - name: broker
          image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/swarmrsi-local/control-plane:latest
          ports:
            - containerPort: 8080
          env:
            - {name: GCP_PROJECT_ID, value: "${PROJECT_ID}"}
            - {name: GCP_REGION, value: "${REGION}"}
            - {name: ALLOYDB_HOST, value: "${ALLOYDB_HOST}"}
            - {name: CAS_BUCKET, value: "${PROJECT_ID}-swarmrsi-cas-artifacts"}
            - {name: WORKER_MODEL, value: "gemini-3.5-flash"}
            - {name: OBSERVER_MODEL, value: "gemma-3-27b-it"}
            - {name: GLOBAL_HALT_SUB, value: "swarmrsi-broker-global-halt"}
---
apiVersion: v1
kind: Service
metadata:
  name: broker
  namespace: harness
spec:
  selector:
    app: swarm-control-plane
  ports:
    - port: 8080
      targetPort: 8080
